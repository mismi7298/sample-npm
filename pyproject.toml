[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bas_pipeline"
version = "3.0.0"
authors = [
    {name = "Neeraj Dixit", email = "neerajdixit@eaton.com"}
]
description = "Package for all BAS pipeline functionality"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Proprietary License",
    "Operating System :: OS Independent",
]

dependencies = [
    "bas-data-wrangler==3.0.0.dev0+cipinbox.2422",
    "bas-notifications==1.0.0.dev0+cipinbox.2422",
    "sqlalchemy>=2.0.25,<2.0.49",
    "psycopg2-binary>=2.9.10,<2.9.12",
    "matplotlib>=3.8.3,<3.10.9",
    "networkx==3.6.1"
]

[project.optional-dependencies]
DATABRICKS = ["databricks-sdk>=0.83.0,<0.96.0"]
AZURE = [
    "bas-data-wrangler[AZURE]==3.0.0.dev0+cipinbox.2422"
]
MQTT = [
    "bas-data-wrangler[MQTT]==3.0.0.dev0+cipinbox.2422"
]
unit_test = ["azure-cosmos==4.3.0", "azure-eventhub==5.11.2", "azure-identity==1.25.1", "azure-keyvault-secrets==4.10.0", "kubernetes==34.1.0",
                "pandas==2.2.3", "pyarrow==20.0.0",
                "pytest-asyncio==1.3.0", "pytest-azurepipelines==1.0.5", "pytest-mock==3.15.1", "python-dotenv==1.2.1"
            ]
doc = [
    "Sphinx==6.2.1", # SPHINX IS NEEDED AS THE DOCUMENTATION IS GENERATED BY SPHINX
    "myst-parser==1.0.0", # SPHINX ORIGINALLY WORKS WITH RESTRUCTURED TEXT. THIS EXTENSION HELPS IT WORK WITH MARKDOWNS
    "sphinx-new-tab-link==0.2.1", # THIS LIBRARY HELPS TO OPEN EXTERNAL LINKS IN NEW TAB
    "nbsphinx==0.9.3", # REMOVE THIS IF YOU DONT HAVE SAMPLE NOTEBOOKS
    "sphinx-design==0.5.0", # NEED FOR GRIDS/CARDS/CSS INTEGRATIONS WITH PYTHON
    "sphinx-rtd-theme==1.3.0", # THEME OF THE DOCUMENTATION
    "rst-to-myst==0.4.0", # NEEDED FOR AUTODOC API TO CONVERT IT FROM RST TO MD
    "autodoc-pydantic==2.0.1", # REMOVE THIS IF YOU DONT HAVE PYDANTIC
    "sphinx-pydantic==0.1.1", # REMOVE THIS IF YOU DONT HAVE PYDANTIC
    "sphinx-reredirects==0.1.2", # NEEDED FOR BAS LIBRARY DOCUMENTATION AND NOT FOR BAS DOCUMENTATION.
    "toml-cli==0.6.0" # NEEDED TO ACCESS VARIABLES FROM TOML FILES
]

[tool.setuptools.packages.find]
include = ["bas.*"]
exclude = ["test*", "samples*"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
line-length = 88
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F", "N", "D", "T201", "T203", "LOG001", "G"]
ignore = ["D401", "D203", "D212","D404"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88



[project.urls]
repository = "https://github.com/etn-corp/bas-pipeline"
bug-tracker = "https://github.com/etn-corp/bas-sdk-python/issues/new/choose"
